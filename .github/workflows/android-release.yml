name: Android release bundle (AAB)

# Builds the production Android App Bundle on GitHub's runners (no Expo account needed), verifies it with
# Google's bundletool and stores it as a workflow artifact. Signing uses the upload key from repository secrets;
# without them the bundle is UNSIGNED (it cannot be uploaded to Google Play) and the artifact is named accordingly.
#
# Secrets (Settings > Secrets and variables > Actions):
#   ANDROID_UPLOAD_KEYSTORE_BASE64   required  base64 of the upload keystore
#   ANDROID_UPLOAD_STORE_PASSWORD    required  keystore password
#   ANDROID_UPLOAD_KEY_ALIAS         optional  default: upload
#   ANDROID_UPLOAD_KEY_PASSWORD      optional  default: the keystore password
# See docs/ANDROID_RELEASE.md. The signing path itself is proven without any secret by the "Signing and device
# self-test" workflow (.github/workflows/device-check.yml).

on:
  workflow_dispatch:
  push:
    branches: ['claude/**', 'main']
    tags: ['v*']
    paths-ignore: ['**/*.md', 'docs/**', 'store/**']

# Never cancel a running (expensive) native build; a newer push waits in the queue instead.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build-aab:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Keystore location (outside the repository)
        run: echo "WORKEARN_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Generate the native Android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Prepare the upload keystore (only if secrets are configured)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          RAW_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          RAW_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          RAW_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Pasting often adds spaces or line breaks; none of these values may contain whitespace.
          STORE_PASS=$(printf '%s' "$RAW_STORE_PASSWORD" | tr -d '[:space:]')
          KEY_PASS=$(printf '%s' "$RAW_KEY_PASSWORD" | tr -d '[:space:]')
          KEY_ALIAS=$(printf '%s' "$RAW_KEY_ALIAS" | tr -d '[:space:]')
          KEY_ALIAS="${KEY_ALIAS:-upload}"
          KEY_PASS="${KEY_PASS:-$STORE_PASS}"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$WORKEARN_UPLOAD_STORE_FILE"
            # Fail early, with a readable message, if the secrets do not belong together.
            if ! keytool -list -keystore "$WORKEARN_UPLOAD_STORE_FILE" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/keytool-list.txt" 2>&1; then
              echo "::error::The upload keystore could not be opened. Check the secret ANDROID_UPLOAD_KEYSTORE_BASE64 (the whole text, nothing added or missing) and ANDROID_UPLOAD_STORE_PASSWORD. If you set ANDROID_UPLOAD_KEY_ALIAS, it must match the alias in the keystore (default: upload)."
              exit 1
            fi
            {
              echo "WORKEARN_UPLOAD_STORE_PASSWORD=$STORE_PASS"
              echo "WORKEARN_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
              echo "WORKEARN_UPLOAD_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Upload keystore decoded and opened."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No upload keystore secrets configured - the bundle will be UNSIGNED and cannot be uploaded to Google Play."
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build the release bundle
        working-directory: android
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m"

      - name: Locate and verify the bundle with bundletool
        id: verify
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          gh release download --repo google/bundletool --pattern 'bundletool-all-*.jar' --output "$RUNNER_TEMP/bundletool.jar"
          {
            echo "# WorkEarn AAB verification"
            echo
            echo "File: $(basename "$AAB")  ($(du -h "$AAB" | cut -f1))"
            echo "SHA-256: $(sha256sum "$AAB" | cut -d' ' -f1)"
            echo
            echo "## bundletool validate"
            java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$AAB" && echo "VALID"
            echo
            echo "## Base manifest"
            java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB" > "$RUNNER_TEMP/manifest.xml"
            cat "$RUNNER_TEMP/manifest.xml"
            echo
            echo "## Signature"
            jarsigner -verify -verbose:summary "$AAB" || true
          } | tee aab-report.txt
          # Hard assertions: identity, version and target API required by Google Play (expected values come from app.json)
          EXPECT_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          EXPECT_NAME=$(node -p "require('./app.json').expo.version")
          EXPECT_PKG=$(node -p "require('./app.json').expo.android.package")
          echo "version=$EXPECT_NAME" >> "$GITHUB_OUTPUT"
          grep -q "package=\"$EXPECT_PKG\"" "$RUNNER_TEMP/manifest.xml"
          grep -q "android:versionCode=\"$EXPECT_CODE\"" "$RUNNER_TEMP/manifest.xml"
          grep -q "android:versionName=\"$EXPECT_NAME\"" "$RUNNER_TEMP/manifest.xml"
          grep -q 'android:targetSdkVersion="36"' "$RUNNER_TEMP/manifest.xml"
          # The privacy claims depend on this: the only permission allowed is the AndroidX-internal, signature-level one.
          PERMS=$(grep -o '<uses-permission[^>]*android:name="[^"]*"' "$RUNNER_TEMP/manifest.xml" | sed 's/.*android:name="//; s/"$//' | sort -u || true)
          UNEXPECTED=$(printf '%s\n' "$PERMS" | grep -v -x -e "" -e "$EXPECT_PKG.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" || true)
          echo "Declared permissions:"; printf '%s\n' "${PERMS:-none}"
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Unexpected permissions in the bundle (update the privacy documents or remove the dependency):"
            printf '%s\n' "$UNEXPECTED"
            exit 1
          fi
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            # A bundle built with the upload key must really carry that signature, or Google Play will refuse it.
            jarsigner -verify "$AAB" > "$RUNNER_TEMP/jarsigner.txt" 2>&1 || true
            if ! grep -q "jar verified" "$RUNNER_TEMP/jarsigner.txt"; then
              cat "$RUNNER_TEMP/jarsigner.txt"
              echo "::error::The bundle is not signed with the upload key."
              exit 1
            fi
            keytool -printcert -jarfile "$AAB" > "$RUNNER_TEMP/signer.txt" 2>&1 || true
            {
              echo
              echo "## Upload certificate that signed this bundle (compare with Play Console > App signing)"
              grep -E "Owner:|SHA256:|Valid from:" "$RUNNER_TEMP/signer.txt" || true
            } | tee -a aab-report.txt
          fi
          mkdir -p dist-aab
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp "$AAB" dist-aab/WorkEarn-$EXPECT_NAME-release.aab
          else
            cp "$AAB" dist-aab/WorkEarn-$EXPECT_NAME-UNSIGNED.aab
          fi
          cp aab-report.txt dist-aab/
          cat aab-report.txt >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.signed == 'true' && 'workearn-release-aab' || 'workearn-UNSIGNED-aab' }}
          path: dist-aab/*
          if-no-files-found: error
          retention-days: 30
